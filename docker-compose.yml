services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vpn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: ./backend/VpnAPI
    env_file:
      - ./backend/VpnAPI/.env
    depends_on:
      - postgres
    entrypoint: ["/migrate", "-path", "/migrations", "-cmd", "up"]
    restart: "no"

  vpnapi:
    build:
      context: ./backend/VpnAPI
    env_file:
      - ./backend/VpnAPI/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # наружу не публикуем

  bot:
    build:
      context: ./bot
    env_file:
      - ./bot/.env
    depends_on:
      - vpnapi
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # наружу не публикуем

  connect_bot:
    build:
      context: ./connect_bot
    env_file:
      - ./connect_bot/.env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    expose:
      - "8091"

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  monitor:
    build:
      context: ./monitor
    env_file:
      - ./monitor/.env
    depends_on:
      - vpnapi
      - redis
      - bot
    volumes:
      # 3x-ui: ./db/access.log на хосте → укажите каталог в XRAY_ACCESS_LOG_HOST_DIR
      - ${XRAY_ACCESS_LOG_HOST_DIR:-/var/log/xray}:/var/log/xray:ro
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: vpnplatform-nginx
    depends_on:
      - vpnapi
      - connect_bot
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped

volumes:
  pgdata: {}
  letsencrypt: {}
  certbot_www: {}