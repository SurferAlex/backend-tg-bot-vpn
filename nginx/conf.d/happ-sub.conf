# Happ redirect: sub.alexsurfervpn.space → connect_bot:8091
# DNS: sub.alexsurfervpn.space A → VPS (port 80). HTTPS: certbot --nginx -d sub.alexsurfervpn.space

upstream connect_bot_redirect {
    server connect_bot:8091;
    keepalive 4;
}

server {
    listen 80;
    server_name sub.alexsurfervpn.space;

    location /happ/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_pass http://connect_bot_redirect/;
    }

    location / {
        return 404;
    }
}
